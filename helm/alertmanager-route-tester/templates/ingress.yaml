{{- if .Values.ingress.enabled }}
{{- $hostname := required "ingress.hostname is required when ingress.enabled is true" .Values.ingress.hostname }}
{{- if or (contains "`" $hostname) (contains "\n" $hostname) }}
{{- fail "ingress.hostname must be a single host and must not contain a backtick" }}
{{- end }}
{{- $fullname := include "alertmanager-route-tester.fullname" . }}
{{- $tls := .Values.ingress.tls | default dict }}
{{- $mtls := .Values.ingress.mtls | default dict }}
{{- $tlsEnabled := $tls.enabled }}
{{- $mtlsEnabled := $mtls.enabled }}
{{- $tlsSecretName := $tls.secretName | default (printf "%s-tls" $fullname) }}
{{- $issuer := $tls.issuer | default dict }}
{{- $issuerKind := $issuer.kind | default "ClusterIssuer" }}
{{- $entryPoints := .Values.ingress.entryPoints | default (list "websecure") }}
{{- $clientAuthType := $mtls.clientAuthType | default "RequireAndVerifyClientCert" }}
{{- if $mtlsEnabled }}
{{- if not $tlsEnabled }}
{{- fail "ingress.tls.enabled must be true when ingress.mtls.enabled is true; mTLS requires TLS, and router.tls.options alone does not enable TLS on the route" }}
{{- end }}
{{- $caSecretName := required "ingress.mtls.caSecretName is required when ingress.mtls.enabled is true" $mtls.caSecretName }}
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: {{ $fullname }}-mtls
  labels:
    {{- include "alertmanager-route-tester.labels" . | nindent 4 }}
spec:
  clientAuth:
    secretNames:
      - {{ $caSecretName | quote }}
    clientAuthType: {{ $clientAuthType }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "alertmanager-route-tester.labels" . | nindent 4 }}
  {{- $generatedAnnotations := dict }}
  {{- if $tlsEnabled }}
  {{- $issuerName := required "ingress.tls.issuer.name is required when ingress.tls.enabled is true" $issuer.name }}
  {{- if eq $issuerKind "ClusterIssuer" }}
  {{- $_ := set $generatedAnnotations "cert-manager.io/cluster-issuer" $issuerName }}
  {{- else }}
  {{- $_ := set $generatedAnnotations "cert-manager.io/issuer" $issuerName }}
  {{- end }}
  {{- with $tls.commonName }}
  {{- $_ := set $generatedAnnotations "cert-manager.io/common-name" . }}
  {{- end }}
  {{- /* spec.tls only selects the certificate; it does not turn TLS on for the router. Without this
     annotation the router stays plaintext on entrypoints that don't enable TLS by default. */}}
  {{- $_ := set $generatedAnnotations "traefik.ingress.kubernetes.io/router.tls" "true" }}
  {{- end }}
  {{- $_ := set $generatedAnnotations "traefik.ingress.kubernetes.io/router.entrypoints" (join "," $entryPoints) }}
  {{- if $mtlsEnabled }}
  {{- /* safeNaming defaults to false on the Traefik kubernetesCRD provider, so cross-namespace
     @kubernetescrd references use the legacy namespace-name@kubernetescrd form unless the
     cluster operator has explicitly enabled safeNaming (namespace_name@kubernetescrd). */}}
  {{- $_ := set $generatedAnnotations "traefik.ingress.kubernetes.io/router.tls.options" (printf "%s-%s-mtls@kubernetescrd" .Release.Namespace $fullname) }}
  {{- end }}
  {{- $userAnnotations := deepCopy (.Values.ingress.annotations | default dict) }}
  {{- $annotations := merge $userAnnotations $generatedAnnotations }}
  annotations:
    {{- range $key, $value := $annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "traefik" | quote }}
  rules:
    - host: {{ $hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  number: {{ include "alertmanager-route-tester.listenPort" . | int }}
  {{- if $tlsEnabled }}
  tls:
    - hosts:
        - {{ $hostname | quote }}
      secretName: {{ $tlsSecretName | quote }}
  {{- end }}
{{- end }}
