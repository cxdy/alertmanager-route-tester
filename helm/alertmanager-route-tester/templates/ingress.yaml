{{- if .Values.traefikIngressRoute.enabled }}
{{- $hostname := required "traefikIngressRoute.hostname is required when traefikIngressRoute.enabled is true" .Values.traefikIngressRoute.hostname }}
{{- $fullname := include "alertmanager-route-tester.fullname" . }}
{{- $tls := .Values.traefikIngressRoute.tls | default dict }}
{{- $mtls := .Values.traefikIngressRoute.mtls | default dict }}
{{- $tlsEnabled := $tls.enabled }}
{{- $mtlsEnabled := $mtls.enabled }}
{{- $tlsSecretName := $tls.secretName | default (printf "%s-tls" $fullname) }}
{{- $issuer := $tls.issuer | default dict }}
{{- $issuerKind := $issuer.kind | default "ClusterIssuer" }}
{{- $entryPoints := .Values.traefikIngressRoute.entryPoints | default (list "websecure") }}
{{- $clientAuthType := $mtls.clientAuthType | default "RequireAndVerifyClientCert" }}
{{- if $mtlsEnabled }}
{{- $caSecretName := required "traefikIngressRoute.mtls.caSecretName is required when traefikIngressRoute.mtls.enabled is true" $mtls.caSecretName }}
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: {{ $fullname }}-mtls
  labels:
    {{- include "alertmanager-route-tester.labels" . | nindent 4 }}
spec:
  clientAuth:
    secretNames:
      - {{ $caSecretName | quote }}
    clientAuthType: {{ $clientAuthType }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "alertmanager-route-tester.labels" . | nindent 4 }}
  annotations:
    {{- if $tlsEnabled }}
    {{- $issuerName := required "traefikIngressRoute.tls.issuer.name is required when traefikIngressRoute.tls.enabled is true" $issuer.name }}
    {{- if eq $issuerKind "ClusterIssuer" }}
    cert-manager.io/cluster-issuer: {{ $issuerName | quote }}
    {{- else }}
    cert-manager.io/issuer: {{ $issuerName | quote }}
    {{- end }}
    {{- with $tls.commonName }}
    cert-manager.io/common-name: {{ . | quote }}
    {{- end }}
    {{- end }}
    traefik.ingress.kubernetes.io/router.entrypoints: {{ join "," $entryPoints | quote }}
    {{- if $mtlsEnabled }}
    {{- /* Cross-namespace/provider references use namespace_name@kubernetescrd with safeNaming. */}}
    traefik.ingress.kubernetes.io/router.tls.options: {{ printf "%s_%s-mtls@kubernetescrd" .Release.Namespace $fullname | quote }}
    {{- end }}
    {{- with .Values.traefikIngressRoute.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.traefikIngressRoute.className | default "traefik" | quote }}
  rules:
    - host: {{ $hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  number: {{ include "alertmanager-route-tester.listenPort" . | int }}
  {{- if $tlsEnabled }}
  tls:
    - hosts:
        - {{ $hostname | quote }}
      secretName: {{ $tlsSecretName | quote }}
  {{- end }}
{{- end }}
