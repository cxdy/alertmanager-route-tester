---
replicaCount: 1

image:
  repository: ghcr.io/linode-obs/alertmanager-route-tester
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
extraEnv: []

# Helm replaces this list on override. The map form is no longer merged;
# replace the whole list. Each entry requires name and url. matcher_mode,
# http, retry, and pool are copied through to the app config.
alertmanagers:
  - name: default
    url: http://alertmanager:9093

# 1024-65535. The container runs as UID 65532 and drops all capabilities,
# so a privileged port fails at render time.
service:
  port: 8080

networkPolicy:
  # Empty ingress is intentional default-deny. Do not flip enabled off to open traffic.
  enabled: true
  ingress: []

# Requests are set so the scheduler can place the pod. Limits are omitted so a
# namespace LimitRange can apply its own and so the chart does not throttle CPU.
resources:
  requests:
    cpu: 10m
    memory: 64Mi

# Renders a standard Kubernetes Ingress, annotated for Traefik and
# cert-manager. Leave enabled false unless an Ingress controller is
# installed. tls.enabled is true so cert-manager annotations request a
# Certificate automatically; no Certificate object is rendered by this
# chart. The default className and entrypoints/TLS-options annotations
# are Traefik-specific; adjust className and annotations for another
# controller. An optional Traefik TLSOption CRD is still rendered, and
# referenced by annotation, when mtls.enabled is true (mtls requires
# Traefik regardless of className).
ingress:
  enabled: false
  className: traefik
  hostname: ""
  # Annotations here are merged in last and can override the ones the chart
  # computes (cert-manager issuer, entrypoints, TLS options).
  annotations: {}
  entryPoints:
    - websecure
  tls:
    enabled: true
    # Empty secretName renders as <release fullname>-tls.
    secretName: ""
    # commonName is optional; cert-manager defaults the CN to the first host.
    commonName: ""
    issuer:
      name: ""
      kind: ClusterIssuer
  mtls:
    enabled: false
    clientAuthType: RequireAndVerifyClientCert
    caSecretName: ""
  # Used only when ingress and the NetworkPolicy are both enabled. Set
  # namespace, podLabels, or both. podLabels alone match those labels in
  # every namespace. Set namespace to limit the match. The chart does not
  # guess a controller namespace.
  networkPolicy:
    namespace: ""
    podLabels: {}

extraVolumes: []
extraVolumeMounts: []
deploymentAnnotations: {}
extraObjects: []
