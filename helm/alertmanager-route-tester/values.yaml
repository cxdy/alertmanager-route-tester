---
replicaCount: 1

image:
  repository: ghcr.io/linode-obs/alertmanager-route-tester
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
extraEnv: []

# Helm replaces this list on override. The map form is no longer merged;
# replace the whole list. Each entry requires name and url. matcher_mode,
# http, retry, and pool are copied through to the app config.
alertmanagers:
  - name: default
    url: http://alertmanager:9093

# 1024-65535. The container runs as UID 65532 and drops all capabilities,
# so a privileged port fails at render time.
service:
  port: 8080

networkPolicy:
  # Empty ingress is intentional default-deny. Do not flip enabled off to open traffic.
  enabled: true
  ingress: []

# Requests are set so the scheduler can place the pod. Limits are omitted so a
# namespace LimitRange can apply its own and so the chart does not throttle CPU.
resources:
  requests:
    cpu: 10m
    memory: 64Mi

# Traefik IngressRoute, cert-manager Certificate, and optional TLSOption.
# This is not a Kubernetes Ingress. Leave enabled false unless the
# traefik.io/v1alpha1 CRDs are installed. tls.enabled is true so a
# Certificate renders with the route, and nothing is rendered while the
# route itself is disabled.
traefikIngressRoute:
  enabled: false
  hostname: ""
  entryPoints:
    - websecure
  tls:
    enabled: true
    # Empty secretName renders as <release fullname>-tls.
    secretName: ""
    issuer:
      name: ""
      kind: ClusterIssuer
  mtls:
    enabled: false
    clientAuthType: RequireAndVerifyClientCert
    caSecretName: ""
  # Used only when traefikIngressRoute and the NetworkPolicy are both enabled.
  # Set namespace, podLabels, or both. podLabels alone match those labels in
  # every namespace. Set namespace to limit the match. The chart does not
  # guess a controller namespace.
  networkPolicy:
    namespace: ""
    podLabels: {}

extraVolumes: []
extraVolumeMounts: []
deploymentAnnotations: {}
extraObjects: []
